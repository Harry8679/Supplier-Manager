security:
    # Gestion du hashage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Chargement des utilisateurs depuis la base de données
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Hiérarchie des rôles
    # Un administrateur possède automatiquement les droits d'un utilisateur.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        # Outils de développement et assets accessibles sans authentification
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall principal de l'application
        main:
            lazy: true
            provider: app_user_provider

            # Authentification par formulaire
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

                # Après une connexion réussie
                default_target_path: /dashboard

            # Déconnexion
            logout:
                path: app_logout
                target: app_login

    # IMPORTANT :
    # Symfony utilise uniquement la PREMIÈRE règle qui correspond à l'URL.
    access_control:
        # La page de connexion reste publique
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Administration : uniquement pour toi / ROLE_ADMIN
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Dashboard : utilisateurs connectés
        - { path: ^/dashboard, roles: ROLE_USER }

        # Imports et traitements Excel
        - { path: ^/imports, roles: ROLE_USER }


# Configuration spécifique aux tests automatisés
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10